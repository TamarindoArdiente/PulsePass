<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulsePass · Eventos, artistas y entradas</title>
    <meta name="theme-color" content="#FFF8EC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <!-- Aplica el tema guardado ANTES de pintar, para evitar el parpadeo claro→oscuro -->
    <script>
      try {
        var guardado = localStorage.getItem('pulsepass:tema');
        var oscuro = guardado === 'oscuro' ||
          (guardado !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
