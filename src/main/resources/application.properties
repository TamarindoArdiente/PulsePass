spring.application.name=pulsepass

# --- Perfil -----------------------------------------------------------------
# Por defecto se usa el perfil "dev" (application-dev.properties: secreto JWT de desarrollo,
# usuarios de demostracion y CORS local). En produccion: SPRING_PROFILES_ACTIVE=prod y variables de entorno.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- JWT (Fase 4: seguridad) -------------------------------------------------
# Fuera del perfil dev el secreto NUNCA se escribe aqui: se entrega por variable de entorno (Base64, >= 32 bytes).
#   PowerShell: $env:JWT_SECRET = [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
#   Linux/Mac:  export JWT_SECRET=$(openssl rand -base64 32)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=15m
security.jwt.issuer=pulsepass-api

# --- Administrador inicial (opcional, para produccion) ----------------------
# Si BOOTSTRAP_ADMIN_ENABLED=true se crea (una sola vez) un usuario ADMIN al arrancar.
security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# --- Datos de demostracion (solo se activan en el perfil dev) ---------------
app.seed.enabled=false
app.seed.password=

# --- CORS (frontend) ---------------------------------------------------------
# Origenes permitidos separados por coma. Vite usa http://localhost:5173 por defecto.
# Con el proxy de Vite (/api -> backend) no hace falta CORS, pero asi tambien funciona sin proxy.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Base de datos (PostgreSQL local) ---------------------------------------
# La base "pulsepass" debe existir (CREATE DATABASE pulsepass;); Flyway crea las tablas.
# Los valores tras ":" son el default local; se pueden sobrescribir con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:jungla}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
