spring.application.name=pulsepass

# --- JWT (Fase 4: seguridad) -------------------------------------------------
# El secreto NUNCA se escribe aqui: se entrega por variable de entorno.
#   openssl rand -base64 32      ->  export JWT_SECRET=<valor>
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=15m
security.jwt.issuer=pulsepass-api

# --- Administrador inicial (opcional) ---------------------------------------
# Si BOOTSTRAP_ADMIN_ENABLED=true se crea (una sola vez) un usuario ADMIN al arrancar.
security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
